# Add a team moderator account
MULTI-MODERATOR=true

# True by default. It meant to be disable only for development or testing purpose
FEDERATED=true

# The youngest age to sign up, between 13 and 21: 16 is the GDPR's age of
# consent without parents in most of the EU, 14 in Québec, 13 in the US.
MINIMUM-AGE=16

# Who answers questions about personal data (Québec's Law 25: the person in
# charge of the protection of personal information): a title, and an email.
# Shown under the menu, and in the legal pages ({{PRIVACY_OFFICER_TITLE}},
# {{PRIVACY_EMAIL}}).
# PRIVACY-OFFICER=Administrator
# PRIVACY-EMAIL=privacy@example.com

# The most posts a bot account can publish in an hour (Server rules, 7),
# between 1 and 60.
BOT-POSTS-PER-HOUR=1

# How many days posts and comments removed by the moderators are kept, hidden
# from everyone, so an accepted appeal can bring them back; then they are
# erased with their files. Between 1 and 365 ({{REMOVED_CONTENT_DAYS}} in the
# legal pages).
REMOVED-CONTENT-DAYS=30

# Relays (Moderation → Relays): the site can follow relays, to receive the
# public posts of other servers and send them its own. With this on, it also
# acts as a relay: other servers can follow it (each accepted by an admin),
# and it forwards their public posts to the others. More traffic.
RELAY-SERVER=false