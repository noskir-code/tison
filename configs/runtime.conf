# Tison runtime configuration. Environment variables override these values.
# Use TISON_CONFIG=/path/to/file to load another file.

APP_HOST=127.0.0.1
APP_PORT=8080

INSTANCE_NAME=Tison

# Comment this line for development environment
DATABASE_URL=postgres://user:password@127.0.0.1:5432/postgres
DB_MAX_CONNECTIONS=20
MAX_REQUEST_BODY_MB=20

# trace, debug, info, warn, error (debug also shows every HTTP request)
LOG_LEVEL=info

SESSION_INACTIVITY_DAYS=60
# "Stay signed in": days without visiting before having to log in again.
REMEMBER_ME_DAYS=30
# Defaults to false in debug builds, true in release builds.
# COOKIE_SECURE=true

# Address of the site as users reach it, used in links sent by email.
# Defaults to http://APP_HOST:APP_PORT.
# PUBLIC_BASE_URL=https://example.com

# Outgoing email (password reset).
#
# Development: run Mailpit, it catches every email in a web inbox at
# http://127.0.0.1:8025 and nothing reaches real people:
#   podman run -d --name mailpit -p 1025:1025 -p 8025:8025 docker.io/axllent/mailpit
# Debug builds without SMTP settings use it automatically when it runs, else
# print the emails in the log. To always use it: SMTP_PROVIDER=mailpit
#Dev only. Comment for production use
SMTP_PROVIDER=mailpit
#
# Production: without SMTP_HOST (or SMTP_PROVIDER), release builds can't send emails.
# SMTP_HOST=smtp.example.com
# starttls (port 587), tls (port 465), or none (local relay only)
# SMTP_SECURITY=starttls
# SMTP_PORT=587
# SMTP_USERNAME=
# SMTP_PASSWORD=
# SMTP_FROM=Tison <noreply@example.com>

# Fediverse (ActivityPub): Mastodon, Pixelfed... users can follow local users
# as @username@domain, where the domain comes from PUBLIC_BASE_URL. It must be
# https and reachable from the Internet for other servers to accept Tison.
# FEDERATION=true
# Lets federation, the media proxy and link previews reach http:// and private
# addresses, ONLY to test on one machine: on a real server anyone could make
# Tison call your network (a link in a post is enough).
# FEDERATION_ALLOW_INSECURE=false

# Videos, podcasts and live streams (VIDEO, AUDIOSTREAMING and LIVE-STREAMING
# in services.conf) need ffmpeg and ffprobe, like PeerTube and Owncast. Without
# them these services are turned off. Paths, if they aren't in the PATH:
# FFMPEG=/usr/bin/ffmpeg
# FFPROBE=/usr/bin/ffprobe
# The largest video or podcast episode that can be uploaded, in MB.
# MAX_VIDEO_MB=4096
# Videos are made in every quality from their own size down to 144p, like
# PeerTube: their own size lightly compressed (CRF 20), each smaller one more
# (720p CRF 24, 480p 26, 360p 28, 240p 31, 144p 34).
# x264's speed: slow makes smaller files than medium, and takes about twice
# as long. ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow.
# VIDEO_PRESET=slow
# The best quality made, by the short side: 2160 (4K), 1440, 1080, 720...
# Lower it on a small server: 4K takes long to convert and much disk space.
# VIDEO_MAX_LINES=2160
# Conversions running at once, for different users (each user's uploads are
# converted one after the other). Each one uses several cores: 2 suits most
# servers, more if it has many cores and memory.
# VIDEO_CONVERSIONS=2
# Where OBS (or any RTMP app) sends live streams: rtmp://your-domain:1935/live
# with the stream key shown in Tison. Open this port in the firewall.
# RTMP_HOST=0.0.0.0
# RTMP_PORT=1935

# Events show a map of where they take place: their address is looked up
# with OpenStreetMap's Nominatim (one question a second, as its rules ask),
# like Mobilizon. Another Nominatim server, or off to never ask:
# GEOCODER=https://nominatim.openstreetmap.org/search
