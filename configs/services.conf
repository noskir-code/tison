###  ------------- ###
###   ActivityPub  ###
###  ------------- ###
# Types of services offered to the users as main functions
# Read at start: IMAGESHARING, IMAGESYSTEM, VIDEO, LIVE-STREAMING, AUDIOSTREAMING, PUBLISHING,
# EVENT-PLANNING, CONTENT-AGGREGATOR and DFRN for now, the others aren't written yet.
# A service set to false disappears: its pages, menu links and buttons, and
# what other servers send for it is ignored. Nothing is deleted.

# Mainly based on Mastodon
BLOGGING=true

# Mainly based on Mastodon and PixelFed with images in posts
# true: users can add up to 4 photos to their posts. false: no photo button,
# photos sent are ignored (those of other servers are still shown).
IMAGESHARING=true
# How posts of photos look, when IMAGESHARING is true:
# true: like on PixelFed, the photos first in a carousel, the caption under them, and a Photos tab on profiles
# false: like on Mastodon, the text first and the photos in a gallery under it
IMAGESYSTEM=true

# Mainly based on PeerTube and Loop: a Videos page, video uploads converted for every browser.
# Needs ffmpeg (see runtime.conf).
VIDEO=true
# Mainly based on Owncast and PeerTube: going live from OBS with a stream key, watched in the browser.
# Needs ffmpeg and the RTMP port (see runtime.conf).
LIVE-STREAMING=true

# Mainly based on Funkwhale and castopod: podcasts with episodes and an RSS feed for podcast apps.
# Needs ffmpeg (see runtime.conf).
AUDIOSTREAMING=true

# Mainly based on Lemmy: the communities
CONTENT-AGGREGATOR=true

# Mainly based on Bookwyrm, write freely and WordPress
# true: an Article tab to write articles with a title in Markdown, sent like WriteFreely's,
# and an Articles tab on profiles. false: no new articles, those of other servers arrive as posts.
PUBLISHING=true

# Mainly based on Mobilizon: events and meetups (a date, a place or a link online), people join them,
# here or from Mobilizon, and add them to their calendar.
EVENT-PLANNING=true

# Mainly based on Friendica (Distributed Friends & Relations Network): friends and the messenger
DFRN=true



### --------- ###
###  Bridges  ###
### --------- ###
# Bridges you want to use which let your users to interact with users from other protocols than ActivityPub

# Macro-blogging protocol used by Bluesky
AT_PROTOCOL=true

# Macro-blogging protocol used by diaspora*
DIASPORA=true

# Real-time communication protocol for chat, voice over IP and videotelephony
MATRIX=true

# Macro-blogging protocol used by Hubzilla
ZOT=true